# Local development: API only (uses MongoDB Atlas via .env.development)
# Usage: docker compose up --build
services:
  api:
    build:
      context: .
      target: development
    restart: unless-stopped
    env_file:
      - .env.development
    ports:
      - "4070:4070"
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
