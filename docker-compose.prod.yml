# Production stack: builds the optimized image and runs the compiled server.
# MongoDB is expected to be a managed/external instance (e.g. Atlas); set
# MONGODB_URI and the JWT secrets in .env.production or your secret manager.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
services:
  api:
    build:
      context: .
      target: production
    restart: always
    env_file:
      - .env.production
    ports:
      - "7000:7000"
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:7000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
